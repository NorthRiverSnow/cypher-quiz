<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cypher クイズ</title>

    <!-- 書体。Storybook 側は .storybook/preview-head.html に同じものがある。
         CSS の @import ではなく link にしてあるのは preconnect を効かせるため。
         和文は unicode-range で 617 面に分かれ CSS 自体が 565KB（gzip 145KB）だが、
         実際に落ちる woff2 は必要なサブセットだけで 1 本 4KB ほど。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@400;900&display=swap"
    />
    <!-- アイコンは display=block。swap だと読み込み前に私用領域の豆腐が見える -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=block"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
